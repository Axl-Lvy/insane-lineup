# Build the wasmJs distribution and ship it to the Axl-Lvy website
# (vendored under public/insane/, same pattern as TarotMeter/MemorChess).
name: Deploy WasmJS

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build WasmJS distribution
        run: ./gradlew :composeApp:wasmJsBrowserDistribution

      - name: Upload artifact
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: insane-lineup-wasm
          path: composeApp/build/dist/wasmJs/productionExecutable/
          retention-days: 1

      - name: Notify Axl-Lvy website
        env:
          TOKEN: ${{ secrets.REPOSITORY_ACCESS_TOKEN }}
        run: |
          artifactUrl="${{ steps.upload-artifact.outputs.artifact-url }}"

          payload=$(cat <<EOF
          {
            "event_type": "update-insane",
            "client_payload": {
              "message": "$artifactUrl"
            }
          }
          EOF
          )

          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$payload" \
            https://api.github.com/repos/Axl-Lvy/Axl-Lvy/dispatches
